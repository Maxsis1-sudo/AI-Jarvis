services:
  - type: web
    name: hopi-meeting-assistant
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install && rm -rf public && mkdir public && cp ../index.html ../styles.css ../app.js ../outlook.js ../config.js ../manifest.webmanifest ../icon.svg ../sw.js public/
    startCommand: cd server && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUMMARY_MODEL
        value: gpt-5-mini
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
